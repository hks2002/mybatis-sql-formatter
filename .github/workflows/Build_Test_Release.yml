name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'main'

# https://github.com/OWNER/REPO/settings/actions
# MUST CHANGE GITHUB_TOKEN PERMISSION FROM READ TO WRITE
# MUST CHANGE GITHUB_TOKEN PERMISSION ALLOW PULL REQUESTS
# ⚠ ⚠ ⚠ You need merge pull request manually ⚠ ⚠ ⚠
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: xvfb-run -a pnpm test
        if: runner.os == 'Linux'

      - name: Package VSIX
        run: pnpm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mybatis-sql-formatter-vsix
          path: '*.vsix'
          if-no-files-found: error

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          config-file: release-please-config.json

      - name: Upload VSIX to GitHub Release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" *.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
